name: Full DevOps CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}

jobs:

# =========================
# 🔍 SONARQUBE SCAN
# =========================
  sonar-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


# =========================
# 🛡️ OWASP DEP CHECK (FAST MODE)
# =========================
  owasp-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      # Cache OWASP DB (MAJOR SPEED BOOST)
      - name: Cache OWASP DB
        uses: actions/cache@v3
        with:
          path: ~/.dependency-check
          key: owasp-db

      - name: Run OWASP Dependency Check
        run: |
          sudo apt update
          sudo apt install -y unzip

          wget https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.4/dependency-check-10.0.4-release.zip
          unzip dependency-check-10.0.4-release.zip

          ./dependency-check/bin/dependency-check.sh \
            --project "DevOps-App" \
            --scan ./backend/package.json \
            --format HTML \
            --out report \
            --enableNodeJS \
            --disableCentral \
            --exclude "**/node_modules/**" \
            --exclude "**/dist/**"


# =========================
# 🐳 BUILD + TRIVY SCAN
# =========================
  build-scan:
    runs-on: ubuntu-latest
    needs: [sonar-analysis, owasp-scan]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t backend-app ./backend

      - name: Trivy Scan (Fast Mode)
        continue-on-error: true
        run: |
          docker run --rm aquasec/trivy image --severity HIGH,CRITICAL backend-app


# =========================
# 🚀 PUSH TO ECR + DEPLOY EKS
# =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build-scan
    continue-on-error: true
    if: always()

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI

      # BUILD ONLY ONCE HERE (avoids duplication issue)
      - name: Build & Push Image
        run: |
          docker build -t backend-app ./backend
          docker tag backend-app:latest $ECR_REPO_URI:latest
          docker push $ECR_REPO_URI:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name my-eks-cluster-poc --region $AWS_REGION

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
